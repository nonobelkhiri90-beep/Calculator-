name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip app
        run: mkdir www _tmp && unzip -q ./*.zip -d _tmp && cp -r "$(dirname "$(find _tmp -name index.html | head -1)")"/. www/
      - name: Set referral server URL
        run: sed -i "s#REF_URL=''#REF_URL='${{ vars.REF_URL }}'#" www/index.html
      - name: Install Capacitor
        run: npm init -y && npm i --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/assets@3 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/geolocation@7 @capacitor-community/background-geolocation
      - name: Config
        run: echo '{"appId":"com.carnotebook.app","appName":"دفتر السيارة","webDir":"www"}' > capacitor.config.json
      - name: Add Android
        run: npx cap add android
      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION WAKE_LOCK; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
      - name: Icons
        continue-on-error: true
        run: mkdir assets && cp www/icons/icon-only.png www/icons/icon-foreground.png www/icons/icon-background.png assets/ && npx capacitor-assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Signing key
        run: mkdir -p ~/.android && ([ -f debug.keystore ] && cp debug.keystore ~/.android/debug.keystore || true)
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: car-notebook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
